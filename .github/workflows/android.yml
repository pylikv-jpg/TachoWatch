name: Build TachoWatch APK / Play AAB

on:
  workflow_dispatch:
    inputs:
      build_play_aab:
        description: Build signed Google Play AAB
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tachowatch-debug-keystore-v1

      - name: Ensure stable debug keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=TachoWatch,C=LT"
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA256:'

      - name: Apply canonical RTO v2 rules
        run: python3 tools/apply_rto_v2.py

      - name: Restore DTCO auto-connect and history allowances
        run: python3 tools/apply_restore_autoconnect_history_summary.py

      - name: Apply confirmed DTCO counter sources
        run: python3 tools/apply_counter_source_fix_v231.py

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android Lint
        continue-on-error: true
        run: gradle lintDebug

      - name: Run detekt
        continue-on-error: true
        run: gradle detekt

      - name: Run ktlint
        continue-on-error: true
        run: gradle ktlintCheck

      - name: Run RTO regression tests and build APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TachoWatch-static-analysis
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/**
            app/build/reports/ktlint/**

      - name: Verify APK signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          KEY_FP="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          APK_FP="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "KEY_SHA256=$KEY_FP"
          echo "APK_SHA256=$APK_FP"
          test -n "$KEY_FP"
          test "$KEY_FP" = "$APK_FP"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TachoWatch-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Play upload keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_play_aab }}
        env:
          TACHOWATCH_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TACHOWATCH_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$TACHOWATCH_UPLOAD_KEYSTORE_BASE64"
          KEYSTORE_PATH="$RUNNER_TEMP/tachowatch-upload.jks"

          # Accept either the raw Base64 value or an accidentally pasted
          # NAME=value line, and ignore whitespace introduced while copying.
          KEYSTORE_B64="$TACHOWATCH_UPLOAD_KEYSTORE_BASE64"
          KEYSTORE_B64="${KEYSTORE_B64#TACHOWATCH_UPLOAD_KEYSTORE_BASE64=}"
          KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"

          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::TACHOWATCH_UPLOAD_KEYSTORE_BASE64 is not valid Base64. Re-copy the first value from TachoWatch-GitHub-secrets.txt."
            exit 1
          fi

          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "TACHOWATCH_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed Google Play AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_play_aab }}
        env:
          TACHOWATCH_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.TACHOWATCH_UPLOAD_KEYSTORE_PASSWORD }}
          TACHOWATCH_UPLOAD_KEY_ALIAS: ${{ secrets.TACHOWATCH_UPLOAD_KEY_ALIAS }}
          TACHOWATCH_UPLOAD_KEY_PASSWORD: ${{ secrets.TACHOWATCH_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$TACHOWATCH_UPLOAD_KEYSTORE_PASSWORD"
          test -n "$TACHOWATCH_UPLOAD_KEY_ALIAS"
          test -n "$TACHOWATCH_UPLOAD_KEY_PASSWORD"
          gradle bundleRelease
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload Google Play AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_play_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: TachoWatch-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
