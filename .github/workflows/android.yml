name: Build TachoWatch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tachowatch-debug-keystore-v1

      - name: Ensure stable debug keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=TachoWatch,C=LT"
          fi

      - name: Restore build 158 dashboard base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, base64, gzip
          old = subprocess.check_output([
              'git','show','453bebe39c4a7042c11bfdfce8e5c595779f1866:.github/workflows/android.yml'
          ], text=True)
          m = re.search(r"payload = '''([^']+)'''", old)
          if not m:
              raise SystemExit('build-158 payload not found')
          data = gzip.decompress(base64.b64decode(m.group(1)))
          Path('app/src/main/java/com/pylikv/tachowatch/DriverDashboardActivity.kt').write_bytes(data)
          PY

      - name: Apply current UI, history and reconnect update
        run: python3 tools/apply_next_update.py

      - name: Apply final work, icon, tab and rest corrections
        run: python3 tools/apply_final_corrections.py

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TachoWatch-debug
          path: app/build/outputs/apk/debug/app-debug.apk