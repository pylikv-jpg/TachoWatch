name: Build TachoWatch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tachowatch-debug-keystore-v1

      - name: Ensure stable debug keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=TachoWatch,C=LT"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep 'SHA256:' || true

      - name: Apply dashboard and 56-day history update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = ''''''
          Path('app/src/main/java/com/pylikv/tachowatch/DriverDashboardActivity.kt').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )

          places = Path('app/src/main/java/com/pylikv/tachowatch/PlacesDecoder.kt')
          s = places.read_text()
          s = s.replace('val show = chronological.takeLast(30)', 'val show = chronological')
          s = s.replace('sb.appendLine("ShowingNewest=${show.size}")', 'sb.appendLine("ShowingAll=${show.size}")')
          places.write_text(s)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 109', 'versionCode = 111')
          g = g.replace('versionName = "1.0-driver-progress-dtco-picker"', 'versionName = "1.0-dashboard-menu-history56"')
          gradle.write_text(g)
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TachoWatch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
